cargo-features = ["codegen-backend"]
[package]
name = "server_upkeep"
version = "0.1.0"
edition = "2024"
authors = ["Valeriy Sakharov <valeratrades@gmail.com>"]
description = "server monitoring/upkeep daemon"
readme = "README.md"
license = "BlueOak-1.0.0"
repository = "https://github.com/valeratrades/server_upkeep"

[package.metadata.docs.rs]
cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
color-eyre = "=0.6.5"
derive-new = "=0.7.0"
dirs = "=6.0.0"
miette = { version = "=7.6.0", features = ["fancy"] }
nix = { version = "=0.31.2", features = ["fs"] }
reqwest = { version = "=0.13.2", features = ["json", "form"] }
serde = { version = "=1.0.228", features = ["derive"] }
tokio = { version = "=1.52.4", features = ["full"] }
tracing = "=0.1.44"
v_utils = { version = "=2.17.6", features = ["macros", "cli", "tracing"] }

[lints.clippy]
# Stable
float_cmp = "allow" # is bad for `==` direct comparisons, but `<` and `>` should be allowed
len_zero = "allow" # `.empty()` is O(1) but on &str only
undocumented_unsafe_blocks = "warn"
tabs_in_doc_comments = "allow"

# Questionable
# const fns, so actually more performant
get_first = "allow"
get_last_with_len = "allow"

[lints.rust]
unused_features = "allow"
